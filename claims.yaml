- id: gergely-infants
  kind: source
  evidence:
    citation_id: gergely1995
    locator: Abstract
    verified: true
    verification_note: Europe PMC abstract of DOI 10.1016/0010-0277(95)00661-H reports a habituation study
      in which 12-month-olds generate expectations about the most rational means action an agent will
      take to its goal. The Gergely and Csibra (2003) abstract describes the same teleological stance
      and principle of efficient action.
  passage: Above that is goal attribution, the reading of behaviour as efficient toward an end, which
    infants perform in the first year, expecting an agent to take the shorter path to its target and showing
    surprise when it does not [@gergely1995; @gergely2003].
- id: baker-inverse-planning
  kind: source
  evidence:
    citation_id: baker2009
    locator: Abstract
    verified: true
    verification_note: Europe PMC abstract of DOI 10.1016/j.cognition.2009.07.005 infers mental states
      by inverting a model of rational planning and relates this to Dennett's intentional stance.
  passage: Cognitive science has modelled this layer as inverse planning, recovering an agent's goals
    by inverting a model of how goals produce rational action [@baker2009], the same structure philosophers
    describe as the intentional stance, a predictive strategy of ascribing beliefs and desires without
    claiming to discover an inner substance [@dennett1987].
- id: kass-bayes-factor
  kind: source
  evidence:
    citation_id: kass1995
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.1080/01621459.1995.10476572 reviews the Bayes factor as a measure
      of evidence between hypotheses and notes it does not require nested models.
  passage: a Bayes factor in the standard sense, positive when the goal model predicts the data better
    and negative when the passive model does [@kass1995].
- id: conant-good-regulator
  kind: source
  evidence:
    citation_id: conant1970
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.1080/00207727008920220 states that any regulator that is maximally
      successful and simple must be isomorphic with the system being regulated.
  passage: 'The good-regulator theorem gives the underlying reason: any system that effectively regulates
    a variable must contain a model of what it regulates, so a well-run controller and the system it controls
    come to mirror each other [@conant1970].'
- id: friston-blanket
  kind: source
  evidence:
    citation_id: friston2013
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.1098/rsif.2013.0475 describes a Markov blanket separating internal
      and external states of a self-organizing system, leading to homoeostasis and a simple form of autopoiesis.
  passage: Before scoring, the candidate unit must be specified, where the system ends and the environment
    begins, and this individuation remains unsolved, whether posed as drawing a Markov blanket around
    a self-organizing region or as identifying the self-producing closure of an autopoietic system [@friston2013;
    @maturana1980].
- id: levin-goals
  kind: source
  evidence:
    citation_id: levin2019
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.3389/fpsyg.2019.02688 defines an Individual by the ability to
      pursue goals at a scale of organization; Friston et al. (2015) abstract casts morphogenesis and
      regeneration as free-energy minimization toward a target form.
  passage: This is the operational core of the liver and embryo cases, in which a disturbed system navigates
    to a target configuration by a route it would not otherwise take, the behaviour that the basal-cognition
    literature reads as goal-directedness in anatomical and physiological space [@levin2019; @friston2015].
- id: klyubin-empowerment
  kind: source
  evidence:
    citation_id: klyubin2005
    locator: Abstract
    verified: true
    verification_note: Abstract of DOI 10.1109/CEC.2005.1554676 defines empowerment as the information-theoretic
      capacity of an agent's actuation channel as observed through its sensors.
  passage: Other operationalizations of the same idea exist, including empowerment, an agent's control
    over its future sensory states, and active inference, the minimization of expected surprise; the model-comparison
    score is one member of this family [@klyubin2005; @friston2010].
- id: agency-score-definition
  kind: definition
  rationale: Defines the instrument's output as a Bayes factor between a goal model and a passive model;
    agency is thereby relative to the named alternative.
  passage: The agency score is the log-likelihood ratio,
- id: agency-excludes
  kind: definition
  rationale: Delimits the measured quantity so that a high score carries no claim about intelligence,
    experience or standing.
  passage: Agency in this sense excludes intelligence, consciousness, and personhood.
- id: linear-models
  kind: assumption
  rationale: The passive family is linear and two-dimensional; a richer passive family could absorb more
    behaviour at a complexity cost, as the Limitations section states.
  passage: In the simulations the passive model is the best-fitting autonomous linear dynamics $x_{t+1}
    = A x_t + b$, and the agent model is $x_{t+1} = x_t + k(g_t - x_t)$, coupled to a goal channel $g_t$
    that the experimenter controls; both are fitted by least squares and scored by their one-step Gaussian
    log-likelihood.
- id: nesting-argument
  kind: interpretation
  rationale: Algebraic nesting of the constant-goal agent model within the passive linear family, which
    explains the chance-level AUC under observation.
  passage: With a constant goal, $x_t + k(g - x_t) = (1-k)x_t + kg$ is a member of the passive family,
    so the passive model fits every constant-goal trajectory at least as well as the agent model and the
    agency score cannot be positive.
- id: intervention-needed
  kind: interpretation
  rationale: Generalizes the nesting result; without an intervention on the goal, no observer can separate
    the two models from the data alone.
  passage: The failure is a property of the data and would affect any observer.
- id: counterfactual-signature
  kind: interpretation
  rationale: States which perturbations are informative (goal shifts, obstruction) and why state displacement
    is not, following from the uninformative-perturbation result.
  passage: 'The signature is counterfactual goal preservation: the system continues to reach or hold the
    same target across changes of path, obstacle, and starting point that a passive process would not
    survive.'
- id: relative-score
  kind: interpretation
  rationale: The score is a margin against a named passive alternative, never a binary verdict.
  passage: The score is relative to the models compared, a limitation inherent to the method.
